<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>ISBN → Barcode Generator</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400;500&family=Playfair+Display:wght@400;700;900&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --ink: #0e0e0e;
      --paper: #f5f0e8;
      --cream: #ede7d5;
      --accent: #c8372d;
      --muted: #7a7060;
      --stripe: #e8e0cc;
      --bar-dark: #111111;
      --bar-light: #f5f0e8;
    }

    body {
      background-color: #fff;
      color: var(--ink);
      font-family: 'DM Mono', monospace;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 0 1rem 4rem;
      position: relative;
      overflow-x: hidden;
    }

    /* Background texture - disabled for clean white background */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image: none;
      opacity: 0;
      pointer-events: none;
      z-index: 0;
    }

    header {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 720px;
      padding: 3.5rem 0 2rem;
      border-bottom: 2px solid var(--ink);
      margin-bottom: 3rem;
    }

    .tag {
      font-size: 0.65rem;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 0.6rem;
    }

    h1 {
      font-family: 'Playfair Display', serif;
      font-size: clamp(2.4rem, 6vw, 4rem);
      font-weight: 900;
      line-height: 1.05;
      letter-spacing: -0.02em;
    }

    h1 span {
      color: var(--accent);
      font-style: italic;
    }

    .subtitle {
      margin-top: 0.75rem;
      font-size: 0.75rem;
      color: var(--muted);
      letter-spacing: 0.05em;
    }

    /* Main card */
    .card {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 720px;
      background: #fff;
      border: 2px solid var(--ink);
      box-shadow: 6px 6px 0 var(--ink);
      padding: 2.5rem 2.5rem 2rem;
      margin-bottom: 2.5rem;
    }

    .input-section label {
      display: block;
      font-size: 0.65rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 0.55rem;
    }

    .input-row {
      display: flex;
      gap: 0.75rem;
      flex-wrap: wrap;
    }

    .input-row input {
      flex: 1;
      min-width: 200px;
      font-family: 'DM Mono', monospace;
      font-size: 1.1rem;
      letter-spacing: 0.12em;
      padding: 0.85rem 1rem;
      border: 2px solid var(--ink);
      background: #fff;
      color: var(--ink);
      outline: none;
      transition: box-shadow 0.15s;
    }

    .input-row input:focus {
      box-shadow: 3px 3px 0 var(--accent);
    }

    .input-row input::placeholder { color: var(--muted); }

    .btn {
      font-family: 'DM Mono', monospace;
      font-size: 0.78rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      font-weight: 500;
      padding: 0.85rem 1.6rem;
      background: var(--ink);
      color: var(--paper);
      border: 2px solid var(--ink);
      cursor: pointer;
      transition: background 0.12s, color 0.12s, box-shadow 0.12s;
      white-space: nowrap;
    }
    .btn:hover { background: var(--accent); border-color: var(--accent); box-shadow: 3px 3px 0 var(--ink); }
    .btn:active { transform: translate(2px, 2px); box-shadow: none; }

    .btn-outline {
      background: transparent;
      color: var(--ink);
    }
    .btn-outline:hover { background: var(--ink); color: var(--paper); }

    .hint {
      margin-top: 0.65rem;
      font-size: 0.67rem;
      color: var(--muted);
      letter-spacing: 0.04em;
    }

    .error {
      margin-top: 1rem;
      font-size: 0.75rem;
      color: var(--accent);
      letter-spacing: 0.04em;
      min-height: 1.1em;
    }

    /* Divider */
    .divider {
      border: none;
      border-top: 1px dashed var(--muted);
      margin: 1.75rem 0;
    }

    /* Options row */
    .options-row {
      display: flex;
      gap: 1.5rem;
      flex-wrap: wrap;
      align-items: center;
    }

    .options-row label {
      font-size: 0.65rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--muted);
      display: flex;
      align-items: center;
      gap: 0.5rem;
      cursor: pointer;
    }

    .options-row select, .options-row input[type=color] {
      font-family: 'DM Mono', monospace;
      font-size: 0.72rem;
      padding: 0.3rem 0.5rem;
      border: 1.5px solid var(--ink);
      background: #fff;
      cursor: pointer;
    }

    input[type=color] { width: 2rem; height: 1.6rem; padding: 0.1rem; cursor: pointer; }

    /* Output */
    .output-card {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 720px;
      background: #fff;
      border: 2px solid var(--ink);
      box-shadow: 6px 6px 0 var(--ink);
      padding: 2.5rem;
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 1.5rem;
    }

    .output-card.visible { display: flex; }

    .barcode-label {
      font-size: 0.65rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--muted);
      align-self: flex-start;
    }

    #barcode-container {
      width: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 2rem 1.5rem;
      background: #fff;
      border: 1.5px solid var(--stripe);
      position: relative;
    }

    #barcode-container canvas {
      max-width: 100%;
    }

    .isbn-info {
      width: 100%;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 1rem;
    }

    .info-block {
      padding: 0.9rem 1rem;
      border: 1.5px solid var(--stripe);
      background: #f9f9f9;
    }

    .info-block .info-label {
      font-size: 0.6rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 0.3rem;
    }

    .info-block .info-value {
      font-size: 0.95rem;
      letter-spacing: 0.08em;
      color: var(--ink);
    }

    .output-actions {
      display: flex;
      gap: 0.75rem;
      flex-wrap: wrap;
      align-self: flex-end;
    }

    /* Footer */
    footer {
      position: relative;
      z-index: 1;
      margin-top: 3rem;
      font-size: 0.62rem;
      color: var(--muted);
      letter-spacing: 0.1em;
      text-align: center;
    }

    /* Animate in */
    @keyframes slideUp {
      from { opacity: 0; transform: translateY(18px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .output-card.visible { animation: slideUp 0.3s ease; }
  </style>
</head>
<body>

<header>
  <p class="tag">Barcode Generator · EAN-13 / ISBN</p>
  <h1>ISBN to <span>Barcode</span></h1>
  <p class="subtitle">Enter an ISBN-10 or ISBN-13 — get a print-ready EAN-13 barcode instantly.</p>
</header>

<div class="card">
  <div class="input-section">
    <label for="isbn-input">ISBN Number</label>
    <div class="input-row">
      <input id="isbn-input" type="text" placeholder="e.g. 978-0-306-40615-7" maxlength="17" autocomplete="off" spellcheck="false"/>
      <button class="btn" onclick="generate()">Generate</button>
    </div>
    <p class="hint">Accepts ISBN-10, ISBN-13, or with/without hyphens and spaces.</p>
    <p class="error" id="error-msg"></p>
  </div>

  <hr class="divider"/>

  <div class="options-row">
    <label>Scale
      <select id="opt-scale">
        <option value="2">Small (2×)</option>
        <option value="3" selected>Medium (3×)</option>
        <option value="4">Large (4×)</option>
      </select>
    </label>
    <label>Bar color
      <input type="color" id="opt-fg" value="#0e0e0e"/>
    </label>
    <label>Background
      <input type="color" id="opt-bg" value="#ffffff"/>
    </label>
    <label>Show text
      <input type="checkbox" id="opt-text" checked/>
    </label>
  </div>
</div>

<div class="output-card" id="output-card">
  <span class="barcode-label">Generated Barcode</span>
  <div id="barcode-container">
    <canvas id="barcode-canvas"></canvas>
  </div>
  <div class="isbn-info" id="isbn-info"></div>
  <div class="output-actions">
    <button class="btn btn-outline" onclick="copyISBN()">Copy ISBN</button>
    <button class="btn" onclick="downloadPNG()">Download PNG</button>
  </div>
</div>

<footer>ISBN BARCODE GENERATOR · EAN-13 STANDARD · WORKS OFFLINE · NO DATA SENT</footer>

<script>
/* ─── EAN-13 encoder (pure JS, no lib needed) ─── */

const EAN13_L = {
  '0':'0001101','1':'0011001','2':'0010011','3':'0111101','4':'0100011',
  '5':'0110001','6':'0101111','7':'0111011','8':'0110111','9':'0001011'
};
const EAN13_G = {
  '0':'0100111','1':'0110011','2':'0011011','3':'0100001','4':'0011101',
  '5':'0111001','6':'0000101','7':'0010001','8':'0001001','9':'0010111'
};
const EAN13_R = {
  '0':'1110010','1':'1100110','2':'1101100','3':'1000010','4':'1011100',
  '5':'1001110','6':'1010000','7':'1000100','8':'1001000','9':'1110100'
};

const PARITY = {
  '0':'LLLLLL','1':'LLGLGG','2':'LLGGLG','3':'LLGGGL','4':'LGLLGG',
  '5':'LGGLLG','6':'LGGGLL','7':'LGLGLG','8':'LGLGGL','9':'LGGLGL'
};

function ean13Checksum(digits12) {
  let sum = 0;
  for (let i = 0; i < 12; i++) {
    sum += parseInt(digits12[i]) * (i % 2 === 0 ? 1 : 3);
  }
  return ((10 - (sum % 10)) % 10).toString();
}

function encodeEAN13(digits13) {
  const first = digits13[0];
  const parity = PARITY[first];
  let bits = '101'; // start guard

  // left 6
  for (let i = 0; i < 6; i++) {
    const d = digits13[i + 1];
    bits += parity[i] === 'L' ? EAN13_L[d] : EAN13_G[d];
  }

  bits += '01010'; // centre guard

  // right 6
  for (let i = 7; i < 13; i++) {
    bits += EAN13_R[digits13[i]];
  }

  bits += '101'; // end guard
  return bits; // 95 modules
}

/* ─── ISBN helpers ─── */

function cleanISBN(raw) {
  return raw.replace(/[\s\-]/g, '').toUpperCase();
}

function isbn10to13(isbn10) {
  const core = isbn10.slice(0, 9);
  const base = '978' + core;
  return base + ean13Checksum(base);
}

function validateAndConvert(raw) {
  const clean = cleanISBN(raw);

  if (clean.length === 10) {
    // validate ISBN-10 check digit
    let s = 0;
    for (let i = 0; i < 9; i++) s += parseInt(clean[i]) * (10 - i);
    const check = clean[9] === 'X' ? 10 : parseInt(clean[9]);
    s += check;
    if (s % 11 !== 0) return { error: 'Invalid ISBN-10 check digit.' };
    return { isbn10: clean, isbn13: isbn10to13(clean), original: raw.trim() };
  }

  if (clean.length === 13) {
    if (!/^\d{13}$/.test(clean)) return { error: 'ISBN-13 must be 13 digits.' };
    const expected = ean13Checksum(clean.slice(0, 12));
    if (clean[12] !== expected) return { error: `Invalid ISBN-13 check digit (expected ${expected}).` };
    // derive isbn10 if 978 prefix
    let isbn10 = null;
    if (clean.startsWith('978')) {
      const core = clean.slice(3, 12);
      let s = 0;
      for (let i = 0; i < 9; i++) s += parseInt(core[i]) * (10 - i);
      const rem = (11 - (s % 11)) % 11;
      isbn10 = core + (rem === 10 ? 'X' : rem.toString());
    }
    return { isbn10, isbn13: clean, original: raw.trim() };
  }

  return { error: `Unexpected length (${clean.length}). ISBN must be 10 or 13 characters.` };
}

function formatISBN13(digits) {
  return `${digits.slice(0,3)}-${digits[3]}-${digits.slice(4,6)}-${digits.slice(6,12)}-${digits[12]}`;
}

/* ─── Canvas barcode renderer ─── */

function drawBarcode(canvas, digits13, opts) {
  const { scale = 3, fg = '#0e0e0e', bg = '#f5f0e8', showText = true } = opts;

  const bits = encodeEAN13(digits13);
  const barW = scale;
  const barH = 69 * scale;
  const quietH = barH + (showText ? 12 * scale : 4 * scale);
  const guardH = barH + 5 * scale;
  const quietZone = 11 * scale;
  const totalW = bits.length * barW + quietZone * 2;
  const totalH = quietH + 4 * scale;

  canvas.width = totalW;
  canvas.height = totalH;

  const ctx = canvas.getContext('2d');
  ctx.fillStyle = bg;
  ctx.fillRect(0, 0, totalW, totalH);

  const top = 2 * scale;

  // draw bars
  for (let i = 0; i < bits.length; i++) {
    const isGuard = (i < 3) || (i >= 45 && i <= 49) || (i >= 92);
    const h = isGuard ? guardH : barH;
    if (bits[i] === '1') {
      ctx.fillStyle = fg;
      ctx.fillRect(quietZone + i * barW, top, barW, h);
    }
  }

  // text
  if (showText) {
    const fontSize = 8 * scale;
    ctx.fillStyle = fg;
    ctx.font = `${fontSize}px "DM Mono", monospace`;
    ctx.textBaseline = 'top';

    const textY = top + guardH + 1 * scale;

    // left digit (first)
    ctx.textAlign = 'right';
    ctx.fillText(digits13[0], quietZone - 1 * scale, textY);

    // left 6 digits (positions 1-6)
    const leftStart = quietZone + 3 * barW;
    const leftWidth = 6 * 7 * barW;
    ctx.textAlign = 'center';
    for (let i = 0; i < 6; i++) {
      const cx = leftStart + (i * 7 + 3.5) * barW;
      ctx.fillText(digits13[i + 1], cx, textY);
    }

    // right 6 digits (positions 7-12)
    const rightStart = quietZone + (3 + 6*7 + 5) * barW;
    for (let i = 0; i < 6; i++) {
      const cx = rightStart + (i * 7 + 3.5) * barW;
      ctx.fillText(digits13[i + 7], cx, textY);
    }
  }
}

/* ─── UI logic ─── */

let lastISBN13 = '';

function generate() {
  const input = document.getElementById('isbn-input').value.trim();
  const errEl = document.getElementById('error-msg');
  const outputCard = document.getElementById('output-card');

  errEl.textContent = '';

  if (!input) {
    errEl.textContent = 'Please enter an ISBN number.';
    return;
  }

  const result = validateAndConvert(input);
  if (result.error) {
    errEl.textContent = result.error;
    outputCard.classList.remove('visible');
    return;
  }

  lastISBN13 = result.isbn13;

  const canvas = document.getElementById('barcode-canvas');
  const scale = parseInt(document.getElementById('opt-scale').value);
  const fg = document.getElementById('opt-fg').value;
  const bg = document.getElementById('opt-bg').value;
  const showText = document.getElementById('opt-text').checked;

  drawBarcode(canvas, result.isbn13, { scale, fg, bg, showText });

  // info blocks
  const infoEl = document.getElementById('isbn-info');
  infoEl.innerHTML = '';

  const blocks = [
    { label: 'ISBN-13', value: formatISBN13(result.isbn13) },
    { label: 'ISBN-10', value: result.isbn10 || 'N/A (979 prefix)' },
    { label: 'Format', value: 'EAN-13' },
    { label: 'Check Digit', value: result.isbn13[12] },
  ];

  blocks.forEach(b => {
    infoEl.innerHTML += `
      <div class="info-block">
        <div class="info-label">${b.label}</div>
        <div class="info-value">${b.value}</div>
      </div>`;
  });

  outputCard.classList.add('visible');
  outputCard.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
}

function downloadPNG() {
  const canvas = document.getElementById('barcode-canvas');
  const a = document.createElement('a');
  a.download = `barcode-${lastISBN13 || 'isbn'}.png`;
  a.href = canvas.toDataURL('image/png');
  a.click();
}

function copyISBN() {
  if (!lastISBN13) return;
  navigator.clipboard.writeText(lastISBN13).then(() => {
    const btn = event.target;
    const orig = btn.textContent;
    btn.textContent = 'Copied!';
    setTimeout(() => btn.textContent = orig, 1500);
  });
}

// Enter key support
document.getElementById('isbn-input').addEventListener('keydown', e => {
  if (e.key === 'Enter') generate();
});

// Live re-render on option change
['opt-scale','opt-fg','opt-bg','opt-text'].forEach(id => {
  document.getElementById(id).addEventListener('change', () => {
    if (lastISBN13) generate();
  });
});
</script>
</body>
</html>
